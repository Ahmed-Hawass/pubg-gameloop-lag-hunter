# CI, the verification chain this project is built on.
# Windows-only by design: the engine speaks typeperf / nvidia-smi / tasklist.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# least privilege: nothing here needs write access to the repo
permissions:
  contents: read

# one run per branch/PR at a time: a new push cancels the stale run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # hooks correctness (stale closures, missing deps) — the class of
      # bug the summary-timer shipped with; tsc cannot see it
      - name: Lint (eslint + react-hooks)
        run: npm run lint

      # coverage is built into `npm test` (vitest run --coverage):
      # vite.config.ts carries a v8 threshold floor, so the floor always
      # gates the suite. CONTRIBUTING promises this gate.
      - name: Unit tests (vitest + coverage floor)
        run: npm test

      # tsc runs as part of the build script, this is also the locale
      # type bond check (ar.ts must match en.ts key-for-key)
      - run: npm run build

      - name: Dependency audit (npm)
        # surface known-vulnerable frontend deps without failing the build on
        # low-severity advisories, high+ breaks CI
        run: npm audit --audit-level=high
        continue-on-error: false

  engine:
    name: Engine (tests + clippy + audit)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tests (incl. live typeperf pipeline)
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Clippy (zero warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Format (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-audit.exe
          key: cargo-audit-0.21.0-${{ runner.os }}

      - name: Dependency audit (Rust)
        # RustSec advisories for the engine's dependency tree (ureq, sha2,
        # tauri plugins...). Mirrors npm audit on the frontend job.
        # Pinned version + locked install: the old curl-pipe-sh fetched
        # latest unpinned with no hash check.
        # The binary install is cached: a warm key skips the reinstall.
        shell: bash
        run: |
          if [ "${{ steps.cache-audit.outputs.cache-hit }}" != "true" ]; then cargo install cargo-audit --version 0.21.0 --locked; fi
          cargo audit --manifest-path src-tauri/Cargo.toml

  version-sync:
    name: Version sync (package / tauri / cargo / changelog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The version lives in FOUR places (package.json, tauri.conf.json —
      # twice: version + mainBinaryName, Cargo.toml, CHANGELOG.md) and the
      # release exe's file NAME carries it too. A drifted bump publishes an
      # updater that can never find its own asset. This gate fails the PR
      # the moment any two disagree.
      - name: All version sources agree
        shell: bash
        run: |
          set -eu
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mainbin=$(node -p "require('./src-tauri/tauri.conf.json').mainBinaryName")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')
          # the "## " prefix is part of the match: every header here is
          # "## [1.6.0] - date", so a bare '^\[' anchor never fires and
          # the gate compared 1.6.0 against an empty string forever
          changelog=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "package=$pkg tauri=$conf cargo=$cargo changelog=$changelog mainBinaryName=$mainbin"
          [ "$pkg" = "$conf" ] || { echo "::error::package.json ($pkg) != tauri.conf.json ($conf)"; exit 1; }
          [ "$pkg" = "$cargo" ] || { echo "::error::package.json ($pkg) != Cargo.toml ($cargo)"; exit 1; }
          [ "$pkg" = "$changelog" ] || { echo "::error::package.json ($pkg) != CHANGELOG.md ($changelog)"; exit 1; }
          [ "$mainbin" = "pubg-gameloop-lag-hunter-$pkg" ] \
            || { echo "::error::mainBinaryName ($mainbin) must be pubg-gameloop-lag-hunter-$pkg, the updater matches this exact asset name"; exit 1; }

  release-build:
    name: Release build (full LTO profile)
    # the profile unit tests never touch, built on demand until proven stable
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build release exe
        run: npx tauri build --no-bundle

      # the CLI companion shares the release folder (tauri builds all bins,
      # but this pins the contract explicitly: no cli exe, no release)
      - name: Build release CLI
        run: cargo build --release --bin laghunter-cli --manifest-path src-tauri/Cargo.toml

      # SHA256SUMS.txt is part of the update contract (the engine verifies
      # downloads against it), generate it in the same job that builds the
      # exe, so every manually-triggered release run produces a pair that
      # has actually been built together
      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: ./scripts/checksum.ps1

      - name: Upload release exes + checksums + CLI alias
        uses: actions/upload-artifact@v4
        with:
          name: lag-hunter-release
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/SHA256SUMS.txt
            laghunter.cmd
          if-no-files-found: error
