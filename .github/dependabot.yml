# Dependabot, keeps the dependency tree (and its security advisories)
# from silently aging. The app ships to end users as a binary, so frontend
# and engine deps both end up inside the release exe.

version: 2

updates:
  # Frontend: React/Vite/Vitest stack
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # tauri CLI/api majors can change the build contract, review those by
    # hand; everything else can ride the weekly wave
    commit-message:
      prefix: "deps(npm)"

  # Engine: ureq, sha2, tauri plugins, winreg...
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    # Cargo.lock is tracked (reproducible binary builds), lockfile bumps
    # arrive as version updates, not security shocks
    commit-message:
      prefix: "deps(cargo)"

  # GitHub Actions workflow deps (checkout, setup-node, rust-cache...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(actions)"
