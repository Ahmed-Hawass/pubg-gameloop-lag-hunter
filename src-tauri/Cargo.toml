[package]
name = "pubg-gameloop-lag-hunter"
version = "1.5.0"
description = "Real-time lag diagnosis for PUBG Mobile on GameLoop"
authors = ["Ahmed Hawass"]
license = "MIT"
repository = "https://github.com/Ahmed-Hawass/pubg-gameloop-lag-hunter"
edition = "2021"
rust-version = "1.77.2"
default-run = "pubg-gameloop-lag-hunter"

[lib]
name = "lag_hunter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# update downloads: ureq 2.x (MSRV 1.71 — stays under our rust-version 1.77.2;
# ureq 3.x requires 1.85 and would break the build on older toolchains)
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"
url = "2.5"
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
