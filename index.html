<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUBG GameLoop Lag Hunter</title>
    <style>
      /* boot splash: paints during HTML parse, before any JS bundle or IPC
         gate resolves — replaces the old dark empty window on launch.
         React wipes #root on mount (createRoot), so this only ever shows
         for the first second. Self-contained: zero external requests. */
      html, body { height: 100%; }
      body { margin: 0; background: #141613; overflow: hidden; }
      .boot-splash {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      .boot-icon { border-radius: 14px; animation: boot-settle 0.5s ease both; }
      .boot-name { color: #8c948d; font-size: 13px; letter-spacing: 0.04em; }
      .boot-bar {
        width: 148px;
        height: 3px;
        border-radius: 999px;
        background: #242824;
        overflow: hidden;
      }
      .boot-fill {
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: #53fc18;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-settle {
        from { opacity: 0; transform: scale(0.92); }
      }
      @keyframes boot-slide {
        0% { margin-inline-start: -40%; }
        100% { margin-inline-start: 100%; }
      }
    </style>
  </head>
